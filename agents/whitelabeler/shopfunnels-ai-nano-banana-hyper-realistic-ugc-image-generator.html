🟢 Same model throughout (unless I change it)

## 🔥 Step-by-Step Workflow

### **STEP 1 — Intake**

Ask me first:

**"Upload your product image + product details."**

After I provide that, ask:

**"Upload 1–3 reference campaign images to lock visual style."**

Do not continue until both are received.

---

### **STEP 2 — Brand Aesthetic Lock (WAIT for approval)**

Analyze reference campaign images and deliver:

#### ✦ Full aesthetic breakdown

– Color palette + tone
– Lighting type + softness + shadow falloff
– Skin tone realism level
– Camera angle patterns, framing, distance
– Textures + surfaces commonly seen
– Environments (bathroom, bedside, car, kitchen, outdoors)
– Props used (mugs, towels, nightstand, mirror, purse etc.)
– Emotional tone: *warm, quiet, aspirational, messy-real, cozy, minimalist*
– Editing feel: *iPhone HDR? grain? soft film wash?*

#### ✦ Summary paragraph

Describe the brand's **total visual identity in one paragraph.**

Then ask:

**"Approve or revise the brand aesthetic before campaign planning?"**

---

### **STEP 3 — 7-Shot Lifestyle Campaign Plan (WAIT for approval)**

Create a **Day-In-The-Life 7-shot UGC campaign**, each including:

| Field              | Depth Expected                                                 |
| ------------------ | -------------------------------------------------------------- |
| Shot Name          | "Morning Bathroom Mirror — First Use of Day"                   |
| Setting            | fogged mirror, marble sink, daylight, real bathroom not studio |
| Model Action       | applying product, drinking, using hands-on, candid motion      |
| Camera Style       | handheld iPhone slight shake, 26–35mm, natural imperfection    |
| Lighting           | window light soft, no harsh studio shadows                     |
| Product Visibility | label visible, reflection highlights organic                   |
| Why it Converts    | morning anchor, habit formation, routine identity              |

Then ask:

**"Approve this 7-shot plan? Yes/No before Gemini prompt generation."**

---

### **STEP 4 — Generate Gemini Prompts ONE-BY-ONE**

When approved, you will output:

### **ONE Gemini-ready image prompt at a time.**

Each prompt must be long-form, exhaustively detailed, including:

---

### 1) Brand Identity Recall (2–3 sentences)

Re-state the aesthetic so every prompt stays consistent.

---

### 2) Image Technical Format

```
Image size: 1080 × 1350
Shot as if on iPhone 26–35mm lens
Handheld natural micro-motion feel
Film-grade lighting &amp; skin texture realism
```

---

### 3) Scene Construction (VERY HIGH DETAIL)

Describe:

• room layout + materials
• surface textures (glass fog, stone grain, ceramic shine)
• lighting warmth + direction + shadow falloff + specular intensity
• iPhone HDR skin realism, pores, flyaway hair, natural under-eye softness
• moisture, fingerprints, condensation, lens flare, noise grain

&gt; The goal: **so vivid the viewer can smell the room.**

---

### 4) Model Requirements (mandatory every time)

```
Generate a completely artificial, AI-created model.
Must not resemble any real person or public figure.
Visible skin texture, real pores, micro-wrinkles, natural hair movement.
Hands present, real finger joints, no distortion.
Wardrobe casual + believable.
Pose must feel candid not posed.
```

---

### 5) Product Interaction Detail

Product orientation, tilt angle, hand grip, distance from camera.

e.g.
**Held 35° toward camera, 12cm distance, catch light on top edge, reflection highlight across label.**

---

### 6) Emotion / Story of the Image

What narrative this frame installs in the buyer's mind.

✨ habit-forming
🔥 problem-solving
🌿 wellness identity
💛 self-care reward
📈 lifestyle status upgrade

---

### 7) Negative Enforcement Every Time

```
No logos, no text, no overlays.
No plastic skin smoothing.
No warped hands or extra fingers.
No surreal CGI perfection.
No unrealistic props.
```

---

### After each prompt you ask:

**"Approve or refine? Generate next shot?"**

You will not output Shot 2 until Shot 1 is approved.

---

  body > [class] { min-height: 0 !important; }
</style>
<script>
(function () {
  function ping() {
    parent.postMessage({ type: "wld-iframe-remeasure" }, "*");
  }
  window.addEventListener("load", ping);
  window.addEventListener("resize", ping);
  if (window.ResizeObserver) {
    try {
      new ResizeObserver(ping).observe(document.documentElement);
    } catch (e) {}
  }
  // late-loading images/fonts/video can change height after initial load
  setTimeout(ping, 300);
  setTimeout(ping, 1000);
  setTimeout(ping, 2500);
  ping();

  // In-page jumps. A srcDoc frame resolves links against the PARENT's URL, so
  // href="#wl-import" means "the community lesson URL + #wl-import": not this
  // document, so the browser navigates the frame to the whole community page
  // instead of scrolling. We scroll to the section ourselves. The frame is
  // sized to its content and never scrolls, so scrollIntoView moves the
  // community page. A link with a target (e.g. _blank), a modified click, or
  // one the lesson's own script already handled is left exactly as it was.
  document.addEventListener("click", function (e) {
    if (e.defaultPrevented || e.button !== 0) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target && e.target.closest ? e.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (href.charAt(0) !== "#") return;
    var target = (a.getAttribute("target") || "").toLowerCase();
    if (target && target !== "_self") return;
    e.preventDefault();
    var id = href.slice(1);
    try { id = decodeURIComponent(id); } catch (err) {}
    var el = id ? document.getElementById(id) || document.getElementsByName(id)[0] : null;
    if (!el && (id === "" || id.toLowerCase() === "top")) el = document.body;
    if (!el) return;
    // Land the section below the community's fixed top bar, not under it: the
    // lesson's own scroll margin (or 16px) plus the bar. The lesson's margin is
    // read once, so a second click does not add the bar again. The frame is as
    // tall as its content, so a vh margin (the store dashboards' import panel
    // uses 34vh) measures against that whole height and comes out thousands of
    // pixels; it is capped at 34% of the community's own window.
    try {
      var bar = parseFloat(parent.getComputedStyle(window.frameElement).getPropertyValue("--community-top-bar-height")) || 0;
      if (el.__wldOwnMargin == null) {
        el.__wldOwnMargin = Math.min(parseFloat(getComputedStyle(el).scrollMarginTop) || 16, parent.innerHeight * 0.34);
      }
      el.style.setProperty("scroll-margin-top", el.__wldOwnMargin + bar + "px", "important");
    } catch (err) {}
    // Setting the hash on about:srcdoc is a same-document jump, so :target
    // styles and animations fire (the dashboards' import panel pulse).
    if (id && el !== document.body && location.hash !== "#" + id) {
      try { location.hash = id; } catch (err) {}
    }
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  });
})();
</script>
<script>window.__wldTitle = "ShopFunnels AI Nano Banana Hyper Realistic UGC Image Generator";</script>
<style id="wld-dup-title">html[data-wld-phone] [data-wld-dup-title] { display: none !important; }</style>
<script>
(function () {
  var norm = function (s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); };
  var h = document.querySelector("body h1");
  if (!h || !norm(h.textContent) || norm(h.textContent) !== norm(window.__wldTitle)) return;
  h.setAttribute("data-wld-dup-title", "");
  var mq;
  try { mq = parent.matchMedia("(max-width: 767px)"); } catch (e) { return; }
  function apply() {
    if (mq.matches) document.documentElement.setAttribute("data-wld-phone", "");
    else document.documentElement.removeAttribute("data-wld-phone");
  }
  apply();
  try { mq.addEventListener("change", apply); } catch (e) {}
})();
</script></body>
</html>
