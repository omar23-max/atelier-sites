<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier sites</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Arrivée depuis un autre menu vers le Canvas ou le Studio (2026-11-24) :
      // un cache plein écran évite de voir la page avant l'espace demandé.
      (function () {
        var q = new URLSearchParams(location.search);
        // Rafraîchissement avec le Canvas ouvert sur la page : on rouvre le Canvas seul.
        if (q.get("canvas") === "1" && q.get("page")) {
          location.replace("/canvas.html?page=" + encodeURIComponent(q.get("page")));
          return;
        }
        var o = q.get("ouvrir") || (q.get("studio") === "1" ? "studio" : null);
        if (o !== "canvas" && o !== "studio") return;
        var h = document.documentElement;
        h.classList.add("atl-ouvre");
        h.setAttribute("data-ouvre", o === "canvas" ? "Ouverture du Canvas…" : "Ouverture du Studio d'images…");
        setTimeout(function () { h.classList.remove("atl-ouvre"); }, 20000);
      })();
    </script>
    <style>
      html.atl-ouvre::after { content: attr(data-ouvre); position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center; background: #f4f4f8; color: #1e2a4a; font: 600 18px Inter, system-ui, sans-serif; }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
